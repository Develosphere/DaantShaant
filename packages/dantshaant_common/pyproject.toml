[project]
name = "dantshaant-common"
version = "0.1.0"
description = "Shared types and HTTP clients for DantShaant services"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dantshaant_common"]

[tool.hatch.build.targets.sdist]
packages = ["src/dantshaant_common"]
