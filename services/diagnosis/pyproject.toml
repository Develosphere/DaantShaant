[project]
name = "dantshaant-diagnosis"
version = "0.1.0"
description = "Clinical classification service for DantShaant"
requires-python = ">=3.11"
dependencies = [
    "dantshaant-common",
    "fastapi>=0.115.0",
    "pydantic-settings>=2.2.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv.sources]
dantshaant-common = { path = "../../packages/dantshaant_common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diagnosis"]
