[project]
name = "dantshaant-teeth-analyzer"
version = "0.1.0"
description = "Vision inference service for DantShaant"
requires-python = ">=3.11"
dependencies = [
    "dantshaant-common",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0,<2.0.0",
    "opencv-python-headless>=4.9.0",
    "Pillow>=10.0.0",
    "pydantic-settings>=2.2.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv.sources]
dantshaant-common = { path = "../../packages/dantshaant_common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teeth_analyzer"]
